<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16181d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="chimpanzee"><link rel="manifest" href="./manifest.webmanifest"><title>/chimpanzee</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#16181d;--card:#24272e;--ink:#f6f5f3;--muted:#a3a5ad;--line:#383b42;--coral:#ff7158}
body.paper{color-scheme:light;--bg:#f5f1eb;--card:#fffdf9;--ink:#252525;--muted:#62636a;--line:#dedad3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);transition:background .6s,color .6s}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
#app{max-width:600px;margin:auto;min-height:100dvh;padding:18px 17px 110px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.logo{font-size:23px;letter-spacing:-1px;font-weight:850;color:var(--coral)}.pin{font-size:12px;font-weight:800;padding:10px 13px;background:var(--card);border-radius:10px}
h1{font-size:27px;letter-spacing:-1px;margin:0 0 12px}h2{font-size:19px;margin:0 0 12px}p,.hint{color:var(--muted);line-height:1.5}.hint{font-size:12px}.card{background:var(--card);padding:17px;border-radius:18px;margin-bottom:15px}.stack{display:grid;gap:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.primary{border:0;border-radius:12px;background:var(--coral);color:#fff;font-weight:750;padding:13px 17px}.secondary{background:transparent;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px 15px}.small{font-size:12px;padding:7px 10px}.danger{color:#ff877a}.input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--bg);color:var(--ink);outline:none}.input:focus{border-color:var(--coral)}.muted{color:var(--muted)}.eyebrow{color:var(--coral);letter-spacing:1.5px;font-size:10px;font-weight:850}.art{width:min(72vw,290px);height:min(72vw,290px);border-radius:20px;background:linear-gradient(135deg,#4a393e,#20222b);display:grid;place-items:center;font-size:88px;margin:25px auto}.controls{display:flex;justify-content:center;align-items:center;gap:40px;margin:20px}.controls button{border:0;background:none;color:var(--ink);font-size:30px}.controls button.side{color:var(--muted);font-size:24px}.center{text-align:center}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,600px);background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:13px 8px max(15px,env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:var(--muted);font-size:11px;display:grid;gap:5px;justify-items:center}.nav button span{font-size:21px}.nav button.active{color:var(--coral)}.theme{position:fixed;right:max(15px,calc((100vw - 600px)/2 + 15px));bottom:90px;border:1px solid var(--line);border-radius:40px;background:var(--card);color:var(--ink);height:46px;width:118px;box-shadow:0 5px 20px #0002}.track{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.track:last-child{border:0}.track-title{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{font-size:10px;padding:5px 7px;border-radius:6px;background:var(--bg);color:var(--muted)}.notice{border-left:3px solid var(--coral);padding:10px 12px;background:var(--card);border-radius:5px;font-size:12px;color:var(--muted);margin-bottom:14px}.message{padding:10px 13px;background:var(--card);border-radius:12px;margin-bottom:9px;overflow-wrap:anywhere}.message small{display:block;color:var(--coral);margin-bottom:4px}.hidden{display:none!important}.spacer{height:15px}a{color:var(--coral)}@media(min-width:700px){#app{padding-top:32px}}
</style></head><body><div id="app"></div><button id="theme" class="theme">☀ Paper</button><script>
(()=>{'use strict';
const KEY='chimpanzee.pwa.v1';
const initial={paper:false,role:null,tab:'player',pin:'',pinAt:0,tracks:[],selected:null,drive:[],messages:[],admin:false,request:false,name:'Guest'};
let state;try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...initial}}
const app=document.querySelector('#app'),theme=document.querySelector('#theme');
const API_KEY='chimpanzee.server.url';
const endpoint=localStorage.getItem(API_KEY)||'';
let socket=null,remote=null,identity=null,requester=null;
function sendRemote(type,extra={}){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type,...extra}))}
function connectRemote(type,options={}) {
 if(!endpoint){alert('Configure your WebSocket server URL in Settings first.');return}
 try{socket=new WebSocket(endpoint.replace(/^http/,'ws').replace(/\/$/,'')+'/socket')}catch{alert('Invalid server URL');return}
 socket.onopen=()=>sendRemote(type,options);
 socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
 if(m.type==='error'){alert(m.message);return}
 if(m.type==='joined'){identity=m.id;remote=m.room;state.role=m.role;state.tab='player';save();render()}
 if(m.type==='state'){remote=m.room;render()}
 if(m.type==='role'){state.admin=m.role==='admin';save();render()}
 if(m.type==='admin-request'){requester=m;alert(m.name+' requested admin access');render()}
 if(m.type==='ended'){remote=null;identity=null;state.role=null;save();render();alert('Station ended')}
 };
 socket.onclose=()=>{if(remote){remote=null;identity=null;state.role=null;save();render();alert('Disconnected from station')}};
 socket.onerror=()=>console.warn('WebSocket connection error')
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function pin(){if(!state.pin||Date.now()-state.pinAt>=120000){state.pin=String(Math.floor(Math.random()*10000)).padStart(4,'0');state.pinAt=Date.now();save()}}
function el(tag,attrs={},children=[]){const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else if(k==='onclick')n.addEventListener('click',v);else n.setAttribute(k,v)}for(const child of children)n.append(child);return n}
function node(tag,cls,text){return el(tag,{class:cls,text})}
function btn(label,fn,cls='secondary'){return el('button',{class:cls,text:label,onclick:fn})}
function input(placeholder,type='text'){return el('input',{class:'input',placeholder,type})}
function section(title){return node('h2','',title)}
function card(...children){return el('div',{class:'card'},children)}
function notice(msg){return node('div','notice',msg)}
function text(parent,tag,cls,value){parent.append(node(tag,cls,value))}
function canEdit(){return state.role==='host'||state.admin}
function change(patch){Object.assign(state,patch);save();render()}
function addTrack(t){if(remote){sendRemote('queue-add',t);return}state.tracks.push({...t,id:crypto.randomUUID()});save();render()}
function youtubeId(raw){try{const u=new URL(raw);const h=u.hostname.toLowerCase();if(h==='youtu.be')return u.pathname.slice(1);if(['youtube.com','www.youtube.com','m.youtube.com'].includes(h)){if(u.pathname==='/watch')return u.searchParams.get('v');if(u.pathname.startsWith('/shorts/')||u.pathname.startsWith('/live/'))return u.pathname.split('/')[2]}}catch{}return null}
function header(){if(remote&&state.role==='host')state.pin=remote.pin;const h=el('header');h.append(node('div','logo','/chimpanzee'));if(state.role==='host'){pin();h.append(btn('PIN '+state.pin,()=>navigator.clipboard?.writeText(state.pin),'pin'))}else if(state.role)h.append(node('span','pill',state.admin?'ADMIN':'LISTENER'));app.append(h)}
function welcome(){const wrap=el('div',{class:'stack'});text(wrap,'div','eyebrow','PRIVATE LISTENING');text(wrap,'h1','','Listen together.');text(wrap,'p','','Create a station, share music links, and design your shared listening space.');wrap.append(btn('Start as Host',()=>endpoint?connectRemote('create',{name:'Host'}):change({role:'host',tab:'player'}),'primary'));const name=input('Your display name');const code=input('4-digit station PIN','tel');code.maxLength=4;wrap.append(card(section('Join a station'),name,code,btn('Join as Listener',()=>{if(code.value.length!==4){alert('Enter a 4-digit PIN. This prototype does not connect to other devices.');return}endpoint?connectRemote('join',{pin:code.value,name:name.value.trim()||'Guest'}):change({role:'listener',name:name.value.trim()||'Guest',tab:'player'})},'primary'),notice('Offline prototype: PIN entry is a visual demo. No remote station connection exists.')));app.append(wrap)}
function player(){const v=el('div',{class:'center'});text(v,'h1','','My Station');text(v,'div','eyebrow','NOW PLAYING');const tracks=remote?.queue||state.tracks;const selected=remote?.selected||state.selected;const t=tracks.find(x=>x.id===selected);v.append(node('div','art','♫'));text(v,'h2','',t?.title||'Nothing playing');text(v,'p','',t?.source||'Add music from the Queue tab');const c=el('div',{class:'controls'});const shift=d=>{if(!tracks.length)return;const i=Math.max(0,tracks.findIndex(x=>x.id===selected));const next=tracks[(i+d+tracks.length)%tracks.length].id;if(remote)sendRemote('playback',{selected:next,playing:false});else change({selected:next})};c.append(btn('◀◀',()=>shift(-1),'side'),btn('▶',()=>remote?sendRemote('playback',{selected,playing:!remote.playing,position:0}):alert('Playback is not implemented. YouTube videos must use the authorized YouTube player.')),btn('▶▶',()=>shift(1),'side'));for(const b of c.children)b.disabled=!canEdit();v.append(c);if(t?.source==='YouTube'){const link=el('a',{href:t.url,target:'_blank',rel:'noopener noreferrer',text:'▶ Open in YouTube'});v.append(link)}v.append(notice('This preview does not stream audio. Playback synchronization requires a backend and authorized media players.'));app.append(v)}
function queue(){text(app,'h1','','Music Queue');if(canEdit()){const u=input('Paste YouTube video URL','url'),title=input('Video title (optional)');app.append(card(section('Add YouTube link'),u,title,btn('Add to Queue',()=>{const id=youtubeId(u.value.trim());if(!id||!/^[A-Za-z0-9_-]{11}$/.test(id)){alert('Enter a valid YouTube video link');return}addTrack({title:title.value.trim()||'YouTube video',source:'YouTube',url:u.value.trim()})},'primary')));const d=input('Google Drive shared folder URL','url');app.append(card(section('Google Drive folders'),d,btn('Save Folder',()=>{try{const url=new URL(d.value.trim());if(url.hostname!=='drive.google.com'||!url.pathname.includes('/folders/'))throw Error();if(!state.drive.includes(d.value.trim()))state.drive.push(d.value.trim());save();render()}catch{alert('Enter a valid Google Drive folder URL')}},'secondary'),node('p','hint','Folder URLs are saved locally. Listing and streaming Drive files require an additional indexing or authorized access mechanism.')))}
const list=card(section('Up Next'));const tracks=remote?.queue||state.tracks;if(!tracks.length)list.append(node('p','muted','Your queue is empty.'));tracks.forEach((t,i)=>{const r=el('div',{class:'track'}),info=el('div',{class:'grow'});info.append(node('div','track-title',t.title),node('span','pill',t.source));r.append(info);if(canEdit()){r.append(btn('▶',()=>remote?sendRemote('playback',{selected:t.id,playing:false}):change({selected:t.id}),'secondary small'),btn('↑',()=>move(i,-1),'secondary small'),btn('↓',()=>move(i,1),'secondary small'),btn('×',()=>remote?sendRemote('queue-remove',{id:t.id}):(state.tracks.splice(i,1),save(),render()),'secondary small'))}list.append(r)});app.append(list);if(canEdit()&&state.drive.length){const c=card(section('Saved Drive folders'));state.drive.forEach((url,i)=>{const r=el('div',{class:'track'}),a=el('a',{href:url,target:'_blank',rel:'noopener noreferrer',class:'grow',text:'Folder '+(i+1)});r.append(a,btn('Remove',()=>{state.drive.splice(i,1);save();render()},'secondary small'));c.append(r)});app.append(c)}}
function move(i,d){if(remote){const track=remote.queue[i];if(track)sendRemote('queue-move',{id:track.id,direction:d});return}const j=i+d;if(j<0||j>=state.tracks.length)return;[state.tracks[i],state.tracks[j]]=[state.tracks[j],state.tracks[i]];save();render()}
function listeners(){text(app,'h1','','Listeners');if(remote){const c=card(section('Connected listeners'));remote.members.forEach(m=>{const r=el('div',{class:'track'});r.append(node('span','grow',m.name+' · '+m.role));if(state.role==='host'&&m.role!=='host')r.append(btn(m.role==='admin'?'Revoke':'Make Admin',()=>sendRemote('admin',{id:m.id,grant:m.role!=='admin'}),'secondary small'));c.append(r)});if(state.role!=='host')c.append(btn('Request Admin Access',()=>sendRemote('request-admin'),'primary'));app.append(c);return}app.append(notice('Admin permissions shown here are local demo state only.'));const c=card(section('Listener'),node('p','',state.name+(state.admin?' · Admin':'')));if(state.role==='host'){if(state.request)c.append(node('p','eyebrow','ADMIN ACCESS REQUESTED'));c.append(btn(state.admin?'Revoke Admin':'Give Admin Access',()=>change({admin:!state.admin,request:false}),'primary'));c.append(btn('Decline Request',()=>change({request:false}),'secondary'))}else c.append(btn(state.request?'Cancel Request':'Request Admin Access',()=>change({request:!state.request}),'primary'));app.append(c)}
function chat(){text(app,'h1','','Station Chat');if(remote){const c=card();remote.chat.forEach(m=>c.append(el('div',{class:'message'},[node('small','',m.name),node('div','',m.text)])));const field=input('Write a message');c.append(field,btn('Send',()=>{if(field.value.trim())sendRemote('chat',{message:field.value.trim()})},'primary'));app.append(c);return}app.append(notice('Messages are saved only on this device. Real-time chat is not connected.'));const c=card();state.messages.forEach(m=>c.append(el('div',{class:'message'},[node('small','',m.from),node('div','',m.text)])));const field=input('Write a message');const send=()=>{const val=field.value.trim();if(!val)return;state.messages.push({from:state.role==='host'?'Host':state.name,text:val});save();render()};field.addEventListener('keydown',e=>{if(e.key==='Enter')send()});c.append(field,btn('Send',send,'primary'));app.append(c)}
function settings(){text(app,'h1','','Settings');const serverInput=input('https://your-server.example.com','url');serverInput.value=endpoint;app.append(card(section('Live server'),serverInput,btn('Save server URL',()=>{localStorage.setItem(API_KEY,serverInput.value.trim());location.reload()},'primary'),node('p','hint','A deployed WebSocket server is required for real multi-device sessions. Without a server the app uses local demo mode.')));app.append(card(section('Appearance'),btn(state.paper?'Switch to Slate':'Switch to Paper',toggleTheme,'secondary')));app.append(card(section('Station'),btn('Leave Station',()=>{if(socket)socket.close();remote=null;identity=null;change({role:null,tab:'player'})},'secondary'),node('p','hint','Leaving does not delete local music links and queue.')));app.append(notice('Prototype only: no server, cross-device sync, microphone transmission, or verified PIN authentication.'))}
function navigation(){const n=el('nav',{class:'nav'});[['player','♫','Player'],['queue','☷','Queue'],['listeners','♧','Listeners'],['chat','▤','Chat'],['settings','⚙','Settings']].forEach(([id,icon,label])=>{const b=btn('',()=>change({tab:id}),state.tab===id?'active':'');b.append(node('span','',icon),node('small','',label));n.append(b)});document.body.append(n)}
function toggleTheme(){state.paper=!state.paper;save();render()}
function render(){app.replaceChildren();document.querySelectorAll('.nav').forEach(n=>n.remove());document.body.classList.toggle('paper',state.paper);theme.textContent=state.paper?'☾ Slate':'☀ Paper';theme.style.display=state.role?'block':'none';header();if(!state.role){welcome();return}({player,queue,listeners,chat,settings}[state.tab]||player)();navigation()}
theme.addEventListener('click',toggleTheme);setInterval(()=>{if(state.role==='host'&&Date.now()-state.pinAt>=120000)render()},5000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
})();
</script></body></html>
