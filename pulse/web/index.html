<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <button class="brand" data-action="navigate" data-page="home" aria-label="Chimpanzee Pulse home">
      <span class="brand-icon"><span class="brand-slash">/</span></span>
      <span class="brand-name">chimpanzee<span class="brand-period">.</span><small>P U L S E &nbsp; E D I T I O N</small></span>
    </button>
    <div class="nav-kicker">YOUR SPACE</div>
    <nav id="desktop-nav" class="side-nav" aria-label="Main navigation"></nav>
    <div class="sidebar-spacer"></div>
    <div class="side-feature"><div class="side-feature-glow"></div><span class="feature-glyph">✦</span><span class="feature-caption">FEEL THE FREQUENCY</span><strong>Every beat.<br>Your world.</strong><p>Built for the music you love.</p><button class="text-link" data-action="import">Add your music <span>↗</span></button></div>
    <div class="side-footer"><span class="status-dot"></span><span>OFFLINE-FIRST PLAYER</span><span class="build-num">02 / 26</span></div>
  </aside>
  <div class="app-main">
    <header class="topbar">
      <div class="breadcrumb"><span class="pulse-mini"></span><span id="page-eyebrow">YOUR FREQUENCY</span></div>
      <div class="top-actions">
        <button class="top-search" data-action="search-focus" aria-label="Search music"><svg><use href="#i-search"/></svg><span>Search your sound</span><kbd>/</kbd></button>
        <button class="icon-button hide-mobile" data-action="toggle-theme" aria-label="Toggle theme"><svg><use href="#i-moon"/></svg></button>
        <button class="top-add" data-action="import"><svg><use href="#i-plus"/></svg><span>Add music</span></button>
        <button class="avatar" data-action="navigate" data-page="settings" aria-label="Settings"><span>c.</span></button>
      </div>
    </header>
    <main class="screen" id="screen" tabindex="-1" aria-live="polite"></main>
  </div>
</div>
