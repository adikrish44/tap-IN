name: Publish chimpanzee web apps
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'pulse/web/**'
      - 'bricks/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble all editions without overwriting original
        run: |
          mkdir -p .publish/bricks .publish/pulse
          cp -a web/. .publish/
          cp -a bricks/web/. .publish/bricks/
          cp -a pulse/web/. .publish/pulse/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.publish
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
