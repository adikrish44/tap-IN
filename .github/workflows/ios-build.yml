name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Chimpanzee/**'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS simulator without signing
        run: |
          xcodebuild -project Chimpanzee.xcodeproj -scheme Chimpanzee -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
